name: surveyor-modern checks

on:
  push:
    branches: [feature/LocalStack]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate compose & gate script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          python3 -c "
          import yaml
          d = yaml.safe_load(open('docker-compose.yml'))
          svcs = d['services']

          def args(svc):
              return dict(x.split('=', 1) for x in svcs[svc]['build']['args'])

          # RapidPro + mailroom are fetched at pinned fork tags at build time
          pins = ('djangorestframework==3.18.3 oauthlib==4.0.1 django==5.2.19 '
                  'psycopg==3.3.9 psycopg-binary==3.3.9 certifi==2026.10.23')
          for svc in ('rapidpro', 'celery', 'celerybeat'):
              assert args(svc)['RAPIDPRO_REF'] == 'v9.0.0-ubuviz.7', args(svc)
              assert args(svc)['RAPIDPRO_SECURITY_PINS'] == pins, args(svc)
          assert args('mailroom')['MAILROOM_REF'] == 'v9.0.0-ubuviz.1', args('mailroom')
          assert args('courier')['COURIER_REF'] == 'v9.1.19-ubuviz.1', args('courier')
          assert args('indexer')['INDEXER_REF'] == 'v26.0.1', args('indexer')
          assert args('archiver')['ARCHIVER_REF'] == 'v26.0.1', args('archiver')

          # stack.lock is the deployable pin; keep the build args in step with it
          lock = yaml.safe_load(open('stack.lock'))
          assert lock['rapidpro']['tag'] == args('rapidpro')['RAPIDPRO_REF'], lock['rapidpro']
          assert lock['mailroom']['tag'] == args('mailroom')['MAILROOM_REF'], lock['mailroom']
          assert lock['courier']['tag'] == args('courier')['COURIER_REF'], lock['courier']
          assert lock['courier']['repo'] == args('courier')['COURIER_REPO'], lock['courier']
          assert lock['indexer']['tag'] == args('indexer')['INDEXER_REF'], lock['indexer']
          assert lock['archiver']['tag'] == args('archiver')['ARCHIVER_REF'], lock['archiver']
          assert 'elasticsearch:7.17.28' in svcs['elastic']['image'], svcs['elastic']['image']
          assert '16-3.5-alpine' in svcs['postgres']['image'], svcs['postgres']['image']
          assert '7.2-alpine' in svcs['redis']['image'], svcs['redis']['image']
          assert 'nginx-unprivileged:1.30-alpine' in svcs['nginx']['image'], svcs['nginx']['image']
          assert 'seaweedfs:4.52' in svcs['seaweedfs']['image'], svcs['seaweedfs']['image']

          # Every service image must stay digest-pinned (a floating tag is a
          # supply-chain hole and defeats the CVE scan in security.yml).
          for name, svc in svcs.items():
              image = svc.get('image')
              assert image is None or '@sha256:' in image, (name, image)
          # Every service must come back by itself after a docker daemon restart
          # (systemd's `up` does not re-run when the unit is already active); the
          # one-shot bucket init is the single exception.
          for name, svc in svcs.items():
              expected = 'no' if name == 'seaweedfs-init' else 'unless-stopped'
              assert str(svc.get('restart')) == expected, (name, svc.get('restart'))
          print('rapidpro-docker version locks OK')
          "

      - name: Validate gate script syntax
        run: bash -n scripts/surveyor_gate.sh

  # Full stack smoke test (docker compose build + up + surveyor_gate.sh).
  # Deliberately manual: it builds RapidPro modern (uv) plus AGPL rapidpro/mailroom
  # v9.0.0 from source, which exceeds comfortable standard-runner times. Trigger
  # from a docker-capable runner (self-hosted) or run locally:
  #   docker compose up -d --build
  #   RAPIDPRO_EMAIL=... RAPIDPRO_PASSWORD=... BASE_URL=http://localhost ./scripts/surveyor_gate.sh

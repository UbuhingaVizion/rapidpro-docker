name: surveyor-modern checks

on:
  push:
    branches: [feature/LocalStack]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate compose & gate script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          python3 -c "
          import yaml
          d = yaml.safe_load(open('docker-compose.yml'))
          svcs = d['services']

          def args(svc):
              return dict(x.split('=', 1) for x in svcs[svc]['build']['args'])

          # RapidPro + mailroom are fetched at pinned fork tags at build time
          for svc in ('rapidpro', 'celery', 'celerybeat'):
              assert args(svc)['RAPIDPRO_REF'] == 'v9.0.0-ubuviz.2', args(svc)
          assert args('mailroom')['MAILROOM_REF'] == 'v9.0.0-ubuviz.1', args('mailroom')
          assert args('courier')['COURIER_REF'] == 'v9.1.19', args('courier')
          assert args('indexer')['INDEXER_REF'] == 'v26.0.1', args('indexer')
          assert args('archiver')['ARCHIVER_REF'] == 'v26.0.1', args('archiver')
          assert 'elasticsearch:7.17.9' in svcs['elastic']['image'], svcs['elastic']['image']
          assert '16-3.5-alpine' in svcs['postgres']['image'], svcs['postgres']['image']
          assert '7.2-alpine' in svcs['redis']['image'], svcs['redis']['image']
          print('rapidpro-docker version locks OK')
          "

      - name: Validate gate script syntax
        run: bash -n scripts/surveyor_gate.sh

  # Full stack smoke test (docker compose build + up + surveyor_gate.sh).
  # Deliberately manual: it builds RapidPro modern (uv) plus AGPL rapidpro/mailroom
  # v9.0.0 from source, which exceeds comfortable standard-runner times. Trigger
  # from a docker-capable runner (self-hosted) or run locally:
  #   docker compose up -d --build
  #   RAPIDPRO_EMAIL=... RAPIDPRO_PASSWORD=... BASE_URL=http://localhost ./scripts/surveyor_gate.sh

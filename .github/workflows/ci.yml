name: CI
on: [push, pull_request]
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose config -q

      # Build the images that don't depend on the pinned RapidPro/Mailroom sources
      # (fast; downloads the pinned upstream release binaries). The full stack
      # build + surveyor_gate.sh is documented in gate.yml as a manual step.
      - name: Build lightweight service images
        run: docker compose build courier indexer archiver

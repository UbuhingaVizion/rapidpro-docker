# ---------------------------------------------------------------------------
# App router for the RapidPro stack. TLS terminates at the host edge (certbot /
# reversed proxy), which forwards to this container. Only POST
# /mr/surveyor/submit is exposed under /mr/; everything else there is internal
# and reached by RapidPro over the compose network.
#
# This file is included inside the http{} block, so the directives below run at
# http scope.
# ---------------------------------------------------------------------------

server_tokens off;

# structured access log to stdout (collected by the container runtime)
log_format json_combined escape=json
  '{"time_local":"$time_local",'
  '"remote_addr":"$remote_addr",'
  '"realip_remote_addr":"$realip_remote_addr",'
  '"request":"$request",'
  '"status":$status,'
  '"body_bytes_sent":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"http_referer":"$http_referer",'
  '"http_user_agent":"$http_user_agent"}';

# rate limiting (per source IP)
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;

# trust the host edge / docker networks for the real client IP
set_real_ip_from 172.28.0.0/16;
set_real_ip_from 172.29.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    # nginx-unprivileged image runs as uid 101 and listens on 8080 (mapped to host 80)
    listen      8080;
    server_name localhost;
    access_log  /dev/stdout json_combined;
    resolver    127.0.0.11;

    # Surveyor uploads photos/videos/audio, which can be several MB each
    client_max_body_size 100m;

    # base security headers. HSTS is deliberately NOT set here - it belongs at
    # the TLS-terminating edge. Django disables its own copies of these.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    set $rapid "rapidpro:8000";
    set $courier "courier:8080";
    set $mailroom "mailroom:8090";
    set $seaweedfs "seaweedfs:8333";

    # Django static files (collectstatic output), shared via the `sitestatic` volume
    location ^~ /sitestatic/ {
        alias /sitestatic/;
        access_log off;
        expires 30d;
    }

    # User media/attachments live in SeaweedFS (S3-compatible) under the `temba-attachments`
    # bucket. Proxy it on the same origin so Surveyor media URLs are public/HTTPS.
    location ^~ /media/ {
        # read-only: media is served from the public-read bucket; never proxy writes anonymously
        limit_except GET HEAD {
            deny all;
        }
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        rewrite ^/media/(.*)$ /temba-attachments/$1 break;
        proxy_pass http://$seaweedfs;
    }

    # --- auth endpoints (rate limited) ------------------------------------
    location = /api/v2/authenticate {
        limit_req zone=login burst=5 nodelay;
        proxy_pass         http://$rapid;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location ^~ /accounts/login/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass         http://$rapid;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location = /org/signup/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass         http://$rapid;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # --- /mr/ lockdown -----------------------------------------------------
    # The Surveyor app only needs POST /mr/surveyor/submit; all other mailroom
    # endpoints are internal (RapidPro reaches them over the compose network).
    location = /mr/surveyor/submit {
        limit_except POST {
            deny all;
        }
        limit_req zone=api burst=20 nodelay;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        proxy_pass http://$mailroom;
    }
    location ^~ /mr/ {
        return 403;
    }
    # If IVR or ticket provider callbacks are ever needed through Mailroom, open
    # them explicitly, e.g.:
    #   location ~ "^/mr/ivr/c/[0-9a-f-]+/(handle|status|incoming)$" {
    #       proxy_set_header X-Forwarded-Proto https;
    #       proxy_set_header Host $http_host;
    #       proxy_pass http://$mailroom;
    #   }

    # --- channel webhooks (Courier) ---------------------------------------
    location ^~ /c/ {
        limit_req zone=api burst=50 nodelay;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        proxy_pass http://$courier;
        break;
    }

    location / {
        proxy_pass         http://$rapid;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}

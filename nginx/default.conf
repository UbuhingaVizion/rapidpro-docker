server {
    listen      80;
    server_name localhost;
    access_log  off;
    resolver    127.0.0.11;

    # Surveyor uploads photos/videos/audio, which can be several MB each
    client_max_body_size 100m;

    set $rapid "rapidpro:8000";
    set $courier "courier:8080";
    set $mailroom "mailroom:8090";
    set $minio "minio:9000";

    # Django static files (collectstatic output), shared via the `sitestatic` volume
    location ^~ /sitestatic/ {
        alias /sitestatic/;
        access_log off;
        expires 30d;
    }

    # User media lives in MinIO (S3-compatible) under the `temba-archives` bucket.
    # Proxy it on the same origin so Surveyor media URLs are public/HTTPS.
    location ^~ /media/ {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        rewrite ^/media/(.*)$ /temba-archives/$1 break;
        proxy_pass http://$minio;
    }

    location / {
        proxy_pass         http://$rapid;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    location ^~ /c/ {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        proxy_pass http://$courier;
        break;
    }

    location ^~ /mr/ {
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $http_host;
        proxy_pass http://$mailroom;
        break;
    }
}

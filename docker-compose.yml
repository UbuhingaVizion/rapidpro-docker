name: rapidpro
services:
  nginx:
    image: nginx
    volumes:
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - sitestatic:/sitestatic:ro
    ports:
      - 80:80
    depends_on:
      rapidpro:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.5-alpine # matches RapidPro develop CI
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=temba
      - POSTGRES_DB=temba
      - POSTGRES_PASSWORD=tembatemba
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s

  elastic:
    image: elasticsearch:7.17.9
    volumes:
      - elastic:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ingest.geoip.downloader.enabled=false
      - logger.level=INFO
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s

  redis:
    image: redis:7.2-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis:/data
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio:/data
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=tembatemba
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 2s
      retries: 5

  # one-shot: create the buckets RapidPro/Mailroom/Courier expect and make the media
  # bucket publicly readable (Surveyor downloads media by URL)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 root tembatemba >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing local/temba-archives;
      mc mb --ignore-existing local/temba-attachments;
      mc mb --ignore-existing local/temba-logs;
      mc mb --ignore-existing local/temba-sessions;
      mc anonymous set download local/temba-archives;
      exit 0;
      "
    restart: "no"

  rapidpro:
    build:
      context: ./rapidpro/
      args:
        - RAPIDPRO_REPO=UbuhingaVizion/rapidpro
        - RAPIDPRO_TAG=develop
    command: ["webapp"]
    depends_on:
      postgres:
        condition: service_healthy
      elastic:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailroom:
        condition: service_healthy
      courier:
        condition: service_healthy
    ports:
      - 8000:8000
    environment:
      - MAILROOM_URL=http://mailroom:8090
      - DJANGO_SETTINGS_MODULE=temba.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-a-secret-key-change-me}
      - DATABASE_URL=postgis://temba:tembatemba@postgres:5432/temba
      - REMOTE_CONTAINERS=true
      - REDIS_URL=redis://redis:6379/15
      - ELASTICSEARCH_URL=http://elastic:9200
      - AWS_ACCESS_KEY_ID=root
      - AWS_SECRET_ACCESS_KEY=tembatemba
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_STORAGE_BUCKET_NAME=temba-archives
      - AWS_S3_REGION_NAME=us-east-1
      - AWS_S3_USE_SSL=false
      - AWS_ENDPOINT_URL=http://minio:9000
      - STORAGE_URL=${STORAGE_URL:-http://localhost/media}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-https://*.ngrok-free.app,https://app.ubuviz.com}
    volumes:
      - sitestatic:/rapidpro/sitestatic
    healthcheck:
      test: curl -s http://localhost:8000 >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery:
    build:
      context: ./rapidpro/
      args:
        - RAPIDPRO_REPO=UbuhingaVizion/rapidpro
        - RAPIDPRO_TAG=develop
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      rapidpro:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - MAILROOM_URL=http://mailroom:8090
      - REMOTE_CONTAINERS=true
      - DJANGO_SETTINGS_MODULE=temba.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-a-secret-key-change-me}
      - DATABASE_URL=postgis://temba:tembatemba@postgres:5432/temba
      - REDIS_URL=redis://redis:6379/15
      - ELASTICSEARCH_URL=http://elastic:9200
      - AWS_ACCESS_KEY_ID=root
      - AWS_SECRET_ACCESS_KEY=tembatemba
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_STORAGE_BUCKET_NAME=temba-archives
      - AWS_S3_REGION_NAME=us-east-1
      - AWS_S3_USE_SSL=false
      - AWS_ENDPOINT_URL=http://minio:9000
      - STORAGE_URL=${STORAGE_URL:-http://localhost/media}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-https://*.ngrok-free.app,https://app.ubuviz.com}

  celerybeat:
    build:
      context: ./rapidpro/
      args:
        - RAPIDPRO_REPO=UbuhingaVizion/rapidpro
        - RAPIDPRO_TAG=develop
    command: ["beat"]
    restart: unless-stopped
    depends_on:
      rapidpro:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - MAILROOM_URL=http://mailroom:8090
      - REMOTE_CONTAINERS=true
      - DJANGO_SETTINGS_MODULE=temba.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-a-secret-key-change-me}
      - DATABASE_URL=postgis://temba:tembatemba@postgres:5432/temba
      - REDIS_URL=redis://redis:6379/15
      - ELASTICSEARCH_URL=http://elastic:9200
      - AWS_ACCESS_KEY_ID=root
      - AWS_SECRET_ACCESS_KEY=tembatemba
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - AWS_STORAGE_BUCKET_NAME=temba-archives
      - AWS_S3_REGION_NAME=us-east-1
      - AWS_S3_USE_SSL=false
      - AWS_ENDPOINT_URL=http://minio:9000
      - STORAGE_URL=${STORAGE_URL:-http://localhost/media}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https
      - DJANGO_CSRF_TRUSTED_ORIGINS=${DJANGO_CSRF_TRUSTED_ORIGINS:-https://*.ngrok-free.app,https://app.ubuviz.com}

  mailroom:
    build:
      context: ./mailroom
      args:
        - MAILROOM_REF=v7.5.13
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elastic:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - 8090:8090
    environment:
      - MAILROOM_ADDRESS=0.0.0.0
      - MAILROOM_DB=postgres://temba:tembatemba@postgres:5432/temba?sslmode=disable
      - MAILROOM_REDIS=redis://redis:6379/15
      - MAILROOM_ELASTIC=http://elastic:9200
      - MAILROOM_DOMAIN=${MAILROOM_DOMAIN:-host.docker.internal}
      - MAILROOM_ATTACHMENT_DOMAIN=${MAILROOM_ATTACHMENT_DOMAIN:-host.docker.internal}
      - MAILROOM_DISALLOWED_NETWORKS=6.6.6.6
      - MAILROOM_AWS_ACCESS_KEY_ID=root
      - MAILROOM_AWS_SECRET_ACCESS_KEY=tembatemba
      - MAILROOM_S3_ENDPOINT=http://minio:9000
      - MAILROOM_S3_REGION=us-east-1
      - MAILROOM_S3_MEDIA_BUCKET=temba-attachments
      - MAILROOM_S3_SESSION_BUCKET=temba-sessions
      - MAILROOM_S3_DISABLE_SSL=true
      - MAILROOM_S3_FORCE_PATH_STYLE=true
      - MAILROOM_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8090"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 10s

  courier:
    build:
      context: ./courier
      args:
        - COURIER_REF=v7.5.13
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - 8080:8080
    environment:
      - COURIER_ADDRESS=0.0.0.0
      - COURIER_DB=postgres://temba:tembatemba@postgres:5432/temba?sslmode=disable
      - COURIER_REDIS=redis://redis:6379/15
      - COURIER_DOMAIN=${COURIER_DOMAIN:-host.docker.internal}
      - COURIER_BASE_URL=${COURIER_BASE_URL:-https://host.docker.internal}
      - COURIER_DISALLOWED_NETWORKS=6.6.6.6
      - COURIER_AWS_ACCESS_KEY_ID=root
      - COURIER_AWS_SECRET_ACCESS_KEY=tembatemba
      - COURIER_S3_ENDPOINT=http://minio:9000
      - COURIER_S3_REGION=us-east-1
      - COURIER_S3_ATTACHMENTS_BUCKET=temba-attachments
      - COURIER_S3_DISABLE_SSL=true
      - COURIER_S3_FORCE_PATH_STYLE=true
      - COURIER_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8080"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 10s

  indexer:
    build:
      context: ./indexer
      args:
        - INDEXER_REF=v7.4.0
    depends_on:
      rapidpro:
        condition: service_healthy
    environment:
      - INDEXER_DB=postgres://temba:tembatemba@postgres:5432/temba?sslmode=disable
      - INDEXER_ELASTIC_URL=http://elastic:9200
      - INDEXER_LOG_LEVEL=info

  archiver:
    build:
      context: ./archiver
      args:
        - ARCHIVER_REF=v7.5.0
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - ARCHIVER_DB=postgres://temba:tembatemba@postgres:5432/temba?sslmode=disable
      - ARCHIVER_S3_ENDPOINT=http://minio:9000
      - ARCHIVER_S3_REGION=us-east-1
      - ARCHIVER_S3_BUCKET=temba-archives
      - ARCHIVER_S3_DISABLE_SSL=true
      - ARCHIVER_S3_FORCE_PATH_STYLE=true
      - ARCHIVER_AWS_ACCESS_KEY_ID=root
      - ARCHIVER_AWS_SECRET_ACCESS_KEY=tembatemba
      - ARCHIVER_UPLOAD_TO_S3=true
      - ARCHIVER_ARCHIVE_MESSAGES=true
      - ARCHIVER_ARCHIVE_RUNS=true
      - ARCHIVER_RETENTION_PERIOD=90
      - ARCHIVER_DELETE=false
      - ARCHIVER_LOG_LEVEL=info
    restart: unless-stopped

volumes:
  postgres:
    driver: local
  elastic:
    driver: local
  redis:
    driver: local
  minio:
    driver: local
  sitestatic:
    driver: local
